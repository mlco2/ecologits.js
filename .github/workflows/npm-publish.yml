name: Publish core to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-core
  cancel-in-progress: false

jobs:
  package:
    name: Validate, build and pack core
    if: >-
      github.repository == 'mlco2/ecologits.js' &&
      !github.event.release.prerelease &&
      startsWith(github.event.release.tag_name, 'ecologits-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release target
        working-directory: packages/ecologits.js
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const match = /^ecologits-v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))$/.exec(process.env.RELEASE_TAG ?? '');
          assert.ok(match, 'Expected a stable core tag such as ecologits-v3.0.0');
          assert.equal(pkg.name, '@ecologits/ecologits.js');
          assert.equal(pkg.version, match[1], 'Release tag must match the core package version');
          assert.equal(pkg.publishConfig.access, 'public');
          assert.equal(pkg.publishConfig.registry, 'https://registry.npmjs.org/');
          assert.equal(pkg.publishConfig.tag, 'latest');
          JS
      - name: Require an unpublished npm version
        working-directory: packages/ecologits.js
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const url = `https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${encodeURIComponent(pkg.version)}`;
          const response = await fetch(url, { signal: AbortSignal.timeout(30000) });
          assert.notEqual(response.status, 200, `${pkg.name}@${pkg.version} is already published; npm versions cannot be overwritten`);
          assert.equal(response.status, 404, `Could not verify npm version availability: HTTP ${response.status}`);
          JS
      - name: Install existing Yarn workspaces
        run: npx --yes --package=yarn@1.22.19 yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Build only the core package
        run: npm run build --workspace=@ecologits/ecologits.js
      - name: Pack core without publishing
        working-directory: packages/ecologits.js
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: core-release
          path: packages/ecologits.js/*.tgz
          if-no-files-found: error

  publish:
    name: Publish ONLY the core package
    needs: package

    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false
      - name: Install publishing CLI
        run: npm install --global npm@12.2.0
      - uses: actions/download-artifact@v4
        with:
          name: core-release
          path: release
      - name: Publish validated tarball with OIDC
        working-directory: release
        run: npm publish ./*.tgz --access public --tag latest --registry=https://registry.npmjs.org/
